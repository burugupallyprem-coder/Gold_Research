name: quant-coach-email

# Emails one detailed Quant Coach lesson each morning and the matching interview
# drill each evening — fully in the cloud, so it works with your laptop closed.
# No Slack. Requires three GitHub Secrets: GMAIL_ADDRESS, GMAIL_APP_PASSWORD,
# and (optional) COACH_TO_EMAIL.
#
# RELIABILITY: GitHub cron is best-effort. Each of the two daily sends fires on
# several staggered triggers. The send is wrapped in ops/run_once.py with a
# per-day slot (separate slots for lesson vs drill, matching coach_email.py's own
# 6–18 UTC = lesson rule) so redundant triggers never send a duplicate email or
# double-advance the day counter — but a failed send is retried by the next one.

on:
  workflow_dispatch: {}

permissions:
  contents: write             # so it can commit the advancing day counter

concurrency:
  group: quant-coach          # one at a time; backups queue behind the primary
  cancel-in-progress: false

jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r quant_coach/requirements.txt
      - name: Send today's lesson / drill by email (once per slot)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COACH_TO_EMAIL: ${{ secrets.COACH_TO_EMAIL }}
        run: |
          H=$(date -u +%H)
          if [ "$H" -ge 6 ] && [ "$H" -lt 18 ]; then SLOT=coach-lesson; else SLOT=coach-drill; fi
          python ops/run_once.py --slot "$SLOT" --period date -- python quant_coach/coach_email.py
      - name: Save progress (day counter)
        run: |
          git config user.name  "quant-coach"
          git config user.email "bot@users.noreply.github.com"
          git add quant_coach/memory/coach_state.json memory/run_slots.json || true
          git commit -m "coach: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push skipped"
