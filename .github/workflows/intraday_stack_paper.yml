name: oanda-intraday-stack-paper

# TRACK 2 FORWARD PAPER TRIAL of the intraday stack (FVG+NY, daily-trend filtered).
# Pre-registered 2026-07-22. Simulation only -- this job fetches candles and simulates
# via backtest.engine_final; it can NOT place orders (no broker order code in
# intraday_stack_paper.py). Fully isolated from the champion and from Track 1:
# touches only memory/intraday_stack_state.json and reports/intraday_stack_trades.csv.
#
# Runs in PARALLEL with paper_trade.yml (Track 1, macro daily) and smc_paper.yml.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-stack-paper
  cancel-in-progress: false

jobs:
  intraday-stack-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Integrity check
        run: python -m py_compile intraday_stack_paper.py

      - name: Run intraday-stack paper step
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENV: practice
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python intraday_stack_paper.py

      - name: Commit state
        run: |
          git config user.name  "intraday-stack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory/intraday_stack_state.json reports/intraday_stack_trades.csv 2>/dev/null || true
          git commit -m "intraday-stack-paper: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push skipped"
