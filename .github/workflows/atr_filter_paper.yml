name: oanda-atr-filter-paper

# TRACK 3 FORWARD PAPER TRIAL of the ATR-volatility-gated intraday stack
# (FVG+NY, fast_trend 20/100 filtered, + ATR>=rolling-median gate).
# Pre-registered 2026-07-26. Simulation only -- fetches candles and simulates via
# backtest.engine_final; NO broker order code in atr_filter_paper.py. Fully isolated:
# touches only memory/atr_filter_state.json and reports/atr_filter_trades.csv.
#
# Runs in PARALLEL with paper_trade.yml (baseline), intraday_stack_paper.yml (Track 2),
# and smc_paper.yml. Self-deduplicating (reports only NEW closed trades), so frequent
# runs just add resilience to GitHub's late/dropped cron.

on:
  schedule:
    - cron: "53 */2 * * 1-5"              # every 2h, weekdays (UTC), offset from the others
    - cron: "23 3,7,11,15,19,23 * * 1-5"  # extra offset backups
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atr-filter-paper
  cancel-in-progress: false

jobs:
  atr-filter-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Integrity check
        run: python -m py_compile atr_filter_paper.py
      - name: Run ATR-filter paper step
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ENV: practice
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python atr_filter_paper.py
      - name: Commit state
        run: |
          git config user.name  "atr-filter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory/atr_filter_state.json reports/atr_filter_trades.csv 2>/dev/null || true
          git commit -m "atr-filter-paper: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push skipped"
