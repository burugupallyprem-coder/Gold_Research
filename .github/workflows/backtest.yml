name: oanda-backtest-bot

# Cloud scheduler. Refreshes XAU/USD data, re-runs the backtest, commits the
# updated reports + memory, and posts a Slack summary. Friday adds the weekly
# review. Data lives in GitHub Secrets; nothing secret is committed.

on:
  workflow_dispatch: {}         # allow manual runs from the Actions tab

permissions:
  contents: write               # so the runner can commit memory/ + reports/

concurrency:
  group: oanda-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch 5 years of XAU/USD candles
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV: practice
        run: python data/fetch_oanda.py --days 1825

      - name: Run backtest (and weekly review on Fridays)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CONFIDENCE_THRESHOLD: "60"
        run: |
          python ops/run_once.py --slot backtest --period date -- bash -c '
          python main.py --routine backtest
          if [ "$(date -u +%u)" = "5" ]; then
            python main.py --routine weekly_review
          fi'

      - name: Commit updated reports + memory
        run: |
          git config user.name  "oanda-backtest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory reports || true
          git commit -m "backtest: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push skipped"
